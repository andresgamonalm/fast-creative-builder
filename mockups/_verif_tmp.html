<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="sistema_mockups_fast_creative_builder.css">
<link rel="stylesheet" href="propuestas_mockups_fast_creative_builder.css">
<style>html,body{margin:0}#marco{overflow:hidden;background:#fff}
#out{position:fixed;right:0;top:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;white-space:pre;padding:6px;max-height:100vh;overflow:auto}</style>
</head><body>
<div id="marco" class="p"></div>
<pre id="out"></pre>
<script src="base_mockups_fast_creative_builder.js"></script>
<script src="pantallas_mockups_fast_creative_builder.js"></script>
<script src="editor_mockups_fast_creative_builder.js"></script>
<script src="interiores_mockups_fast_creative_builder.js"></script>
<script>
var TAMX = { escritorio:{w:1440,h:900}, tableta:{w:834,h:1100}, movil:{w:390,h:844} };
var res = [];
function r2(v){ return Math.round(v*10)/10; }
function medir(prop, modo, disp) {
  var m = document.getElementById('marco'), t = TAMX[disp];
  m.className = 'p' + (disp==='movil'?' movil':'') + (disp==='tableta'?' tableta':'');
  m.style.width = t.w+'px'; m.style.height = t.h+'px';
  m.innerHTML = EDITOR[prop](modo);
  ajustarLienzos(m);
  var l = m.querySelector('.ed__lienzo[data-modo]');
  if (!l) { res.push(prop+'/'+modo+'/'+disp+' SIN LIENZO'); return; }
  var caja = l.querySelector('.hoja-escala');
  var hoja = l.querySelector('.hoja');
  var selEl = l.querySelector('.sel');
  var cajaR = caja.getBoundingClientRect();
  var pz = PIEZA[modo];
  // escala efectiva
  var esc = cajaR.width / pz.ancho;
  var out = prop+' '+modo+' '+disp+' esc='+r2(esc*100)+'%';
  if (selEl) {
    var sr = selEl.getBoundingClientRect();
    out += ' | .sel piezaPx x='+r2((sr.left-cajaR.left)/esc)+'..'+r2((sr.right-cajaR.left)/esc)+
           ' y='+r2((sr.top-cajaR.top)/esc)+'..'+r2((sr.bottom-cajaR.top)/esc);
  } else { out += ' | SIN .sel'; }
  var lit = l.getAttribute('data-sel');
  if (lit) { var s = JSON.parse(lit); out += ' || literal x='+s.x+'..'+(s.x+s.ancho)+' y='+s.y+'..'+(s.y+s.alto); }
  // banda regla horizontal y vertical
  var bh = l.querySelector('.regla-h .regla-sel');
  var rh = l.querySelector('.regla-h');
  if (bh) { var br=bh.getBoundingClientRect(), rr=rh.getBoundingClientRect();
    out += ' || bandaH px='+r2(br.left-rr.left)+'..'+r2(br.right-rr.left)+' (reglaW='+r2(rr.width)+')'; }
  var bv = l.querySelector('.regla-v .regla-sel');
  var rv = l.querySelector('.regla-v');
  if (bv) { var bvr=bv.getBoundingClientRect(), rvr=rv.getBoundingClientRect();
    out += ' || bandaV px='+r2(bvr.top-rvr.top)+'..'+r2(bvr.bottom-rvr.top)+' (reglaH='+r2(rvr.height)+')'; }
  var lec = l.querySelector('.lectura');
  if (lec) out += ' || lectura="'+lec.textContent.replace(/\s+/g,' ')+'"';
  res.push(out);
}
window.MEDIR = function(){
  res = [];
  ['a','b','c'].forEach(function(p){
    ['web','email','libre'].forEach(function(mo){
      ['escritorio','tableta','movil'].forEach(function(d){ medir(p,mo,d); });
    });
  });
  document.getElementById('out').textContent = res.join('\n');
  return res.join('\n');
};
window.MEDIR();
</script></body></html>
