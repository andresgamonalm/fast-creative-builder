<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="sistema_mockups_fast_creative_builder.css">
<link rel="stylesheet" href="propuestas_mockups_fast_creative_builder.css">
<style>html,body{margin:0}#marco{overflow:hidden;background:#fff}
#out{position:fixed;right:0;bottom:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;white-space:pre;padding:6px;max-height:70vh;overflow:auto}</style>
</head><body>
<div id="marco" class="p"></div>
<pre id="out"></pre>
<script src="base_mockups_fast_creative_builder.js"></script>
<script src="pantallas_mockups_fast_creative_builder.js"></script>
<script src="editor_mockups_fast_creative_builder.js"></script>
<script src="interiores_mockups_fast_creative_builder.js"></script>
<script>
var TAMX = { escritorio:{w:1440,h:900}, tableta:{w:834,h:1100}, movil:{w:390,h:844} };
var res = [];
function r(n){ return Math.round(n*10)/10; }
function medir(prop, modo, disp) {
  var m = document.getElementById('marco'), t = TAMX[disp];
  m.className = 'p' + (disp==='movil'?' movil':'') + (disp==='tableta'?' tableta':'');
  m.style.width = t.w+'px'; m.style.height = t.h+'px';
  m.innerHTML = EDITOR[prop](modo);
  ajustarLienzos(m);
  var l = m.querySelector('.ed__lienzo[data-modo]');
  var area = l.querySelector('.lienzo-area');
  var caja = l.querySelector('.hoja-escala');
  var chip = l.querySelector('.zoom-chip');
  var rh = l.querySelector('.regla-h');
  var aR = area.getBoundingClientRect();
  var rhR = rh ? rh.getBoundingClientRect() : null;
  var out = [prop+' '+modo+' '+disp+' chip="'+chip.textContent+'" piezaW='+r(aR.width)+
    ' reglaH.left-area.left='+(rhR? r(rhR.left-aR.left):'n/a')+' reglaH.w='+(rhR?r(rhR.width):'n/a')];
  ['.flotante','.lectura','.cota','.guia'].forEach(function(s){
    var els = l.querySelectorAll(s);
    for (var i=0;i<els.length;i++){
      var e = els[i], b = e.getBoundingClientRect();
      var cs = getComputedStyle(e);
      out.push('   '+s+'['+i+'] display='+cs.display+
        ' inlineLeft='+(e.style.left||'-')+' inlineTop='+(e.style.top||'-')+
        ' xRelArea='+r(b.left-aR.left)+' w='+r(b.width)+
        ' derechaRelArea='+r(b.right-aR.left)+
        ' fueraDePieza='+((b.right-aR.left) > aR.width+0.5 || (b.left-aR.left) < -0.5));
    }
  });
  res.push(out.join('\n'));
}
window.MEDIR = function(){
  res = [];
  medir('a','web','tableta'); medir('a','web','escritorio'); medir('a','web','movil');
  medir('b','web','tableta'); medir('b','web','escritorio'); medir('b','web','movil');
  medir('c','web','tableta');
  document.getElementById('out').textContent = res.join('\n\n');
  return res.join('\n\n');
};
window.MEDIR();
</script></body></html>
