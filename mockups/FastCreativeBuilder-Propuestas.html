<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Creative Builder · Tres propuestas de interfaz</title>
<style>
/* sistema_mockups_fast_creative_builder.css */
/* ═══════════════════════════════════════════════════════════════════════
   Fast Creative Builder — sistema visual
   ───────────────────────────────────────────────────────────────────────
   Dirección tomada de zurich.cl, que es la referencia que entregó el
   usuario, leída así:

     · La página NO es azul sobre azul. Alterna BANDAS PASTEL a todo el
       ancho —rosa, celeste, menta, ámbar, arenisca— con mucho aire.
     · El azul saturado se reserva para los botones y los datos, no para
       los fondos de sección.
     · El lenguaje de formas son CÍRCULOS: foto enmascarada en círculo con
       burbujas superpuestas detrás.
     · Los botones son PÍLDORA, azul sólido con chevron. El coral es la
       acción de conversión.
     · Los titulares son grandes y de peso normal, no compactos y pesados.

   Disciplina, jerarquía y prohibiciones: lineamientos-marca-gamonal.
   Valores de color y tipografía: Brandbook Zurich 2024.

   Contrastes verificados uno a uno, no estimados.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* ── Azules de marca ─────────────────────────────────────────────────
     El héroe manda en botones, enlaces y datos. El navy es el color del
     texto y de los titulares sobre cualquier banda pastel. */
  --heroe: #2167ae;
  --heroe-hover: #1b558f;
  --navy: #23366f;
  --azul-medio: #5495cf;
  --azul-claro: #91bfe3;
  --celeste: #1fb1e6;

  /* ── Bandas de sección. Todas dan AA o AAA con titular navy ─────────
     rosa 7,89 · celeste 5,89 · menta 8,13 · ámbar 5,97
     arenisca 7,62 · paloma 8,90 · hueso 9,87 · lima 10,28            */
  --banda-rosa: #ffc5ea;
  --banda-celeste: #91bfe3;
  --banda-menta: #a6e9ab;
  --banda-ambar: #e4b273;
  --banda-arenisca: #dad2bd;
  --banda-paloma: #dde4e3;
  --banda-hueso: #eceeef;
  --banda-lima: #fff773;

  /* Acción de conversión. El coral de campaña de Zurich es #F16F6D, que
     con texto blanco da 2,90 y no cumple AA. Se oscurece a 4,82.
     [Convención declarada] */
  --coral: #cc4038;
  --coral-hover: #b8362f;

  --papel: #ffffff;
  --pagina: #f7f8f8;

  /* ── Texto ───────────────────────────────────────────────────────── */
  --tinta: #23366f;
  --tinta-suave: #4a5570;
  --tinta-tenue: #68717f;

  /* ── Estados ─────────────────────────────────────────────────────── */
  --exito: #1e6b3a;
  --exito-fondo: #e4f1e9;
  --aviso: #7a5a12;
  --aviso-fondo: #f8f1dd;
  --error: #a52a20;
  --error-fondo: #fae9e7;

  /* Contorno de control. 3,53:1 sobre blanco, cumple WCAG 1.4.11 */
  --contorno: #7d8a97;
  --contorno-tenue: #dde1e5;

  /* ── Forma ───────────────────────────────────────────────────────────
     8 px en cajas, campos y contenedores.
     Los CTA van en píldora: es la firma reconocible de Zurich y entra en
     la excepción funcional que permite Gamonal.                       */
  --radio: 8px;
  --pildora: 999px;

  /* ── Escala de 8 ─────────────────────────────────────────────────── */
  --e1: 4px;  --e2: 8px;  --e3: 12px; --e4: 16px; --e5: 24px;
  --e6: 32px; --e7: 40px; --e8: 48px; --e9: 64px; --e10: 80px;
  --e11: 96px; --e12: 128px;

  /* ── Tipografía ──────────────────────────────────────────────────── */
  --fuente: 'Zurich Sans', Arial, Helvetica, sans-serif;
  --t-micro: 12px;
  --t-menor: 14px;
  --t-cuerpo: 16px;
  --t-lead: 18px;
  --t-h4: 20px;
  --t-h3: 26px;
  --t-h2: 34px;
  --t-h1: 46px;

  --canal: 24px;
  --margen: 48px;
}

/* ── Base ────────────────────────────────────────────────────────────── */

.p {
  font-family: var(--fuente);
  font-size: var(--t-cuerpo);
  line-height: 1.55;
  color: var(--tinta);
  background: var(--papel);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.p *, .p *::before, .p *::after { box-sizing: border-box; }
.p h1, .p h2, .p h3, .p h4, .p p, .p ul, .p ol, .p figure { margin: 0; padding: 0; }
.p ul, .p ol { list-style: none; }
.p img { display: block; max-width: 100%; }

/* Titulares grandes y de peso normal, como en la referencia */
.p h1 { font-size: var(--t-h1); font-weight: 400; line-height: 1.12; letter-spacing: -0.015em; }
.p h2 { font-size: var(--t-h2); font-weight: 400; line-height: 1.18; letter-spacing: -0.01em; }
.p h3 { font-size: var(--t-h3); font-weight: 500; line-height: 1.25; }
.p h4 { font-size: var(--t-h4); font-weight: 600; line-height: 1.35; }

.etiqueta { font-size: var(--t-micro); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
.lead { font-size: var(--t-lead); line-height: 1.6; color: var(--tinta-suave); }
.menor { font-size: var(--t-menor); }
.micro { font-size: var(--t-micro); }
.tenue { color: var(--tinta-tenue); }
.suave { color: var(--tinta-suave); }

/* ── CTA en píldora ──────────────────────────────────────────────────── */

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--e2);
  height: 44px;
  padding: 0 var(--e5);
  border: 0;
  border-radius: var(--pildora);
  font-family: inherit;
  font-size: var(--t-menor);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease, transform 100ms ease-out;
}
.cta:active { transform: scale(.985); }

.cta--alto { height: 52px; padding: 0 var(--e6); font-size: var(--t-cuerpo); }
.cta--bajo { height: 36px; padding: 0 var(--e4); }
.cta--ancho { width: 100%; }

.cta--principal { background: var(--heroe); color: #fff; }
.cta--principal:hover { background: var(--heroe-hover); }

/* Acción de conversión */
.cta--conversion { background: var(--coral); color: #fff; }
.cta--conversion:hover { background: var(--coral-hover); }

.cta--secundario { background: var(--papel); color: var(--heroe); box-shadow: inset 0 0 0 1px var(--heroe); }
.cta--secundario:hover { background: #eef4fa; }

.cta--terciario { background: transparent; color: var(--heroe); padding: 0 var(--e2); }
.cta--terciario:hover { color: var(--heroe-hover); }

.cta--sobre-color { background: var(--navy); color: #fff; }
.cta--peligro { background: var(--papel); color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }

.cta .ico { width: 16px; height: 16px; }

/* ═══ Qué botón admite cada banda ═════════════════════════════════════
   Tabla calculada, no estimada. Dos condiciones a la vez: separación de
   3:1 como mínimo entre el botón y su fondo, y familias cromáticas
   distintas, que es lo que prohíbe Gamonal.

     banda        héroe #2167AE   navy #23366F   coral #CC4038
     ─────────────────────────────────────────────────────────
     ámbar        3,02 sí         5,97 sí        2,50 NO · misma familia
     rosa         3,99 sí         7,89 sí        3,31 NO · misma familia
     menta        4,11 sí         4,11 sí        3,41 sí
     arenisca     3,85 sí         7,62 sí        3,20 NO · misma familia
     celeste      2,98 NO         5,89 NO        2,47 NO
     hueso        4,99 sí         9,87 sí        4,14 sí
     blanco       5,81 sí        11,48 sí        4,82 sí

   Consecuencia que conviene recordar: LA BANDA CELESTE NO ADMITE NINGÚN
   BOTÓN. Sirve de fondo para texto y fotografía, nunca para una acción.
   Y el coral sólo va sobre neutro, blanco o verde: sobre ámbar, rosa o
   arenisca sería rojo sobre naranja.
   ═══════════════════════════════════════════════════════════════════ */

/* ── Bandas de sección a todo el ancho ───────────────────────────────── */

.banda { padding: var(--e11) var(--margen); }
.banda--corta { padding: var(--e9) var(--margen); }

.banda--rosa { background: var(--banda-rosa); }
.banda--celeste { background: var(--banda-celeste); }
.banda--menta { background: var(--banda-menta); }
.banda--ambar { background: var(--banda-ambar); }
.banda--arenisca { background: var(--banda-arenisca); }
.banda--paloma { background: var(--banda-paloma); }
.banda--hueso { background: var(--banda-hueso); }
.banda--blanca { background: var(--papel); }
.banda--navy { background: var(--navy); color: #fff; }
.banda--navy h1, .banda--navy h2, .banda--navy h3 { color: #fff; }

.contenedor { max-width: 1120px; margin: 0 auto; }

/* ── Lenguaje de formas: círculo con burbujas ────────────────────────── */

.circulo {
  position: relative;
  flex: none;
  display: inline-block;
}

.circulo__foto {
  border-radius: 50%;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 2;
}

.circulo__fondo {
  position: absolute;
  border-radius: 50%;
  z-index: 1;
}

/* Burbujas del sistema Zurich, tres tamaños, siempre en azules */
.burbuja {
  position: absolute;
  border-radius: 50%;
  z-index: 3;
}
.burbuja--1 { width: 34px; height: 34px; background: var(--navy); }
.burbuja--2 { width: 52px; height: 52px; background: var(--heroe); }
.burbuja--3 { width: 26px; height: 26px; background: var(--azul-claro); }

/* ── Campos ──────────────────────────────────────────────────────────── */

.campo { display: flex; flex-direction: column; gap: var(--e2); }
.campo__et { font-size: var(--t-menor); font-weight: 500; }
.campo__in {
  height: 52px;
  padding: 0 var(--e4);
  background: var(--papel);
  border: 1px solid var(--contorno);
  border-radius: var(--radio);
  font-family: inherit;
  font-size: var(--t-cuerpo);
  color: var(--tinta);
  width: 100%;
}
.campo__in--area { height: auto; min-height: 96px; padding: var(--e3) var(--e4); resize: none; }
.campo__ayuda { font-size: var(--t-micro); color: var(--tinta-tenue); }

/* ── Pastillas ───────────────────────────────────────────────────────── */

.pastilla {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 var(--e3);
  border-radius: var(--pildora);
  font-size: var(--t-micro); font-weight: 600;
}
.pastilla--exito { background: var(--exito-fondo); color: var(--exito); }
.pastilla--aviso { background: var(--aviso-fondo); color: var(--aviso); }
.pastilla--error { background: var(--error-fondo); color: var(--error); }
.pastilla--neutra { background: var(--banda-paloma); color: var(--tinta-suave); }
.pastilla--acento { background: var(--banda-lima); color: var(--navy); }
.punto { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── Tarjeta de acceso rápido, como la fila de iconos de la referencia ── */

.acceso {
  display: flex; flex-direction: column; align-items: center; gap: var(--e3);
  padding: var(--e5) var(--e3);
  background: var(--papel);
  border: 1px solid var(--contorno-tenue);
  border-radius: var(--radio);
  text-align: center;
  cursor: pointer;
  transition: border-color 140ms ease;
}
.acceso:hover { border-color: var(--heroe); }
.acceso__ico {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--azul-claro); color: var(--navy);
  display: grid; place-items: center;
}
.acceso__n { font-size: var(--t-menor); font-weight: 600; line-height: 1.3; }

/* ── Tabla ───────────────────────────────────────────────────────────── */

.tabla { width: 100%; border-collapse: collapse; background: var(--papel); border-radius: var(--radio); overflow: hidden; }
.tabla th {
  padding: var(--e3) var(--e4); text-align: left;
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tinta-tenue); background: var(--banda-paloma);
}
.tabla td { padding: var(--e4); font-size: var(--t-menor); border-top: 1px solid var(--contorno-tenue); vertical-align: middle; }
.tabla tr:first-child td { border-top: 0; }
.tabla__miniatura { width: 56px; height: 40px; border-radius: var(--radio); object-fit: cover; background: var(--banda-paloma); }

/* ── Utilidades ──────────────────────────────────────────────────────── */

.fila { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.crece { flex: 1; min-width: 0; }
.centro { text-align: center; }
.g1{gap:var(--e1)} .g2{gap:var(--e2)} .g3{gap:var(--e3)} .g4{gap:var(--e4)}
.g5{gap:var(--e5)} .g6{gap:var(--e6)} .g8{gap:var(--e8)} .g9{gap:var(--e9)}

.rejilla12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--canal); }

.cuadricula { position: absolute; inset: 0; pointer-events: none; display: none; padding: 0 var(--margen); z-index: 90; }
.mostrar-cuadricula .cuadricula { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--canal); }
.cuadricula span { background: rgba(204, 64, 56, .12); }

/* ── Iconografía ─────────────────────────────────────────────────────── */

.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.ico--16 { width: 16px; height: 16px; }
.ico--24 { width: 24px; height: 24px; }
.ico--28 { width: 28px; height: 28px; }

@media (prefers-reduced-motion: reduce) {
  .p *, .p *::before, .p *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

</style>
<style>
/* propuestas_mockups_fast_creative_builder.css */
/* ═══════════════════════════════════════════════════════════════════════
   Estructura de las tres propuestas, editor y móvil.
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══ Marcos de aplicación ══════════════════════════════════════════════ */

/* A · Taller — lateral de destinos + barra superior */
.a-marco { display: grid; grid-template-columns: 240px 1fr; height: 100%; overflow: hidden; }
.a-lateral {
  background: var(--navy); color: #fff;
  display: flex; flex-direction: column; padding: var(--e5) var(--e3); gap: var(--e6); overflow: hidden;
}
.a-marca { display: flex; align-items: center; gap: var(--e3); padding: 0 var(--e2); }
.a-marca__n { font-size: var(--t-menor); font-weight: 600; line-height: 1.2; }
.a-marca__l { font-size: var(--t-micro); color: var(--azul-claro); }
.a-grupo { display: flex; flex-direction: column; gap: 2px; }
.a-grupo__t { padding: 0 var(--e2) var(--e2); font-size: var(--t-micro); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--azul-claro); }
.a-dest {
  display: flex; align-items: center; gap: var(--e3);
  height: 44px; padding: 0 var(--e3); border-radius: var(--radio);
  font-size: var(--t-menor); font-weight: 500; color: #fff; cursor: pointer;
}
.a-dest--on { background: #fff; color: var(--navy); font-weight: 600; }
.a-pie { margin-top: auto; display: flex; align-items: center; gap: var(--e3); padding: var(--e3); background: #2c4287; border-radius: var(--radio); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--banda-lima); color: var(--navy); display: grid; place-items: center; font-size: var(--t-menor); font-weight: 600; flex: none; }

.a-principal { display: flex; flex-direction: column; overflow: hidden; background: var(--papel); }
.a-barra { height: 68px; flex: none; background: var(--papel); display: flex; align-items: center; gap: var(--e4); padding: 0 var(--margen); }
.a-cuerpo { flex: 1; overflow: auto; }

/* B · Lienzo — riel de íconos */
.b-marco { display: grid; grid-template-columns: 72px 1fr; height: 100%; overflow: hidden; }
.b-riel { background: var(--navy); display: flex; flex-direction: column; align-items: center; gap: var(--e2); padding: var(--e4) 0; }
.b-icono { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radio); color: #fff; cursor: pointer; }
.b-icono--on { background: #fff; color: var(--navy); }
.b-riel__pie { margin-top: auto; }
.b-principal { display: flex; flex-direction: column; overflow: hidden; background: var(--papel); }
.b-cuerpo { flex: 1; overflow: auto; }
.b-buscador {
  height: 56px; display: flex; align-items: center; gap: var(--e3);
  padding: 0 var(--e5); background: var(--papel);
  border: 1px solid var(--contorno); border-radius: var(--pildora);
  color: var(--tinta-tenue); font-size: var(--t-cuerpo);
}

/* C · Escritorio — barra superior ancha */
.c-marco { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.c-barra { height: 68px; flex: none; background: var(--navy); color: #fff; display: flex; align-items: center; gap: var(--e5); padding: 0 var(--margen); }
.c-secciones { height: 52px; flex: none; background: var(--papel); display: flex; align-items: stretch; gap: 2px; padding: 0 var(--margen); }
.c-seccion { display: flex; align-items: center; gap: var(--e2); padding: 0 var(--e4); font-size: var(--t-menor); font-weight: 500; color: var(--tinta-suave); cursor: pointer; }
.c-seccion--on { background: var(--banda-hueso); color: var(--navy); font-weight: 600; border-radius: var(--radio) var(--radio) 0 0; }
.c-cuerpo { flex: 1; overflow: auto; background: var(--papel); }

/* ═══ Login ═════════════════════════════════════════════════════════════ */

.login { display: grid; height: 100%; overflow: hidden; }
.login--a { grid-template-columns: 5fr 7fr; }
.login--b { grid-template-columns: 7fr 5fr; }
.login--c { grid-template-columns: 1fr 1fr; }

.login__panel { background: var(--papel); display: flex; flex-direction: column; justify-content: center; padding: var(--e10) var(--e9); overflow: auto; }
.login__forma { width: 100%; max-width: 384px; display: flex; flex-direction: column; gap: var(--e4); }
.login__visual { position: relative; overflow: hidden; display: grid; place-items: center; padding: var(--e8); }
.login__visual--rosa { background: var(--banda-rosa); }
.login__visual--celeste { background: var(--banda-celeste); }
.login__visual--ambar { background: var(--banda-ambar); }
.login__pie-msg { position: absolute; left: var(--e8); right: var(--e8); bottom: var(--e8); max-width: 420px; }
.login__pie-msg h3 { color: var(--navy); font-weight: 400; }

/* ═══ Editor ════════════════════════════════════════════════════════════ */

.ed-marco { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--banda-hueso); }
.ed-barra { height: 60px; flex: none; background: var(--papel); display: flex; align-items: center; gap: var(--e3); padding: 0 var(--e5); }
.ed-barra--navy { background: var(--navy); color: #fff; }

.grupo-disp { display: flex; gap: 2px; background: var(--banda-hueso); padding: 3px; border-radius: var(--pildora); }
.ed-barra--navy .grupo-disp { background: rgba(255,255,255,.16); }
.grupo-disp__b { width: 34px; height: 30px; display: grid; place-items: center; border-radius: var(--pildora); color: var(--tinta-suave); }
.ed-barra--navy .grupo-disp__b { color: #fff; }
.grupo-disp__b--on { background: var(--papel); color: var(--navy); }

.ed { flex: 1; display: grid; overflow: hidden; }
.ed--a { grid-template-columns: 260px 1fr 288px; }
.ed--b { grid-template-columns: 64px 1fr; position: relative; }
.ed--c { grid-template-columns: 240px 1fr; }

.ed__panel { background: var(--papel); display: flex; flex-direction: column; overflow: hidden; }
.ed__panel-t {
  height: 44px; flex: none; display: flex; align-items: center; gap: var(--e2);
  padding: 0 var(--e4); background: var(--banda-hueso);
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--tinta-suave);
}
.ed__panel-c { flex: 1; overflow: auto; padding: var(--e3); }

.ed-riel { background: var(--banda-hueso); display: flex; flex-direction: column; align-items: center; gap: var(--e2); padding: var(--e3) 0; }
.ed-riel__b { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radio); color: var(--tinta-suave); cursor: pointer; }
.ed-riel__b--on { background: var(--papel); color: var(--heroe); }

.ed-flotante {
  position: absolute; z-index: 40;
  background: var(--papel); border-radius: var(--radio);
  box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 12px 32px rgba(0,0,0,.14);
  display: flex; flex-direction: column; overflow: hidden;
}
.ed-flotante--izq { left: var(--e4); top: var(--e4); bottom: var(--e4); width: 256px; }

/* ── Reglas con píxeles reales ────────────────────────────────────────
   La regla mide el lienzo, no la pantalla. Marca menor cada 10 px, media
   cada 50 y rotulada cada 100. Si el lienzo se reduce para caber, la
   regla se reduce con él, así que la cifra siempre corresponde al píxel
   real de la pieza.                                                    */

.ed__lienzo { position: relative; overflow: auto; background: var(--banda-hueso); }

.zona-regla {
  display: grid;
  grid-template-columns: 24px 1fr;
  grid-template-rows: 24px 1fr;
  min-height: 100%;
  padding: 0 var(--e6) var(--e9) 0;
}

/* ── Reglas con píxeles reales ────────────────────────────────────────────
   Dibuja la regla midiendo el LIENZO, no la pantalla. Marca menor cada
   10 px, media cada 50 y rotulada cada 100. Recibe la escala a la que se
   está mostrando el lienzo y multiplica por ella, de modo que la cifra de
   la regla siempre corresponde al píxel real de la pieza.               */

/* Paso adaptativo: la regla nunca dibuja marcas a menos de 5 px de
   distancia en pantalla, para que se siga leyendo al reducir el lienzo. */
function pasoRegla(escala) {
  var candidatos = [1, 2, 5, 10, 20, 25, 50, 100];
  for (var i = 0; i < candidatos.length; i++) {
    if (candidatos[i] * escala >= 5) return candidatos[i];
  }
  return 100;
}

function reglaHorizontal(anchoPieza, escala, seleccion) {
  var paso = pasoRegla(escala);
  var media = paso * 5;
  var mayor = paso * 10;
  var h = '';
  for (var x = 0; x <= anchoPieza; x += paso) {
    var px = Math.round(x * escala);
    var clase = x % mayor === 0 ? 'marca marca--mayor' : (x % media === 0 ? 'marca marca--media' : 'marca');
    h += '<i class="' + clase + '" style="left:' + px + 'px"></i>';
    if (x % mayor === 0) h += '<i class="regla-n" style="left:' + px + 'px">' + x + '</i>';
  }
  if (seleccion) {
    h += '<i class="regla-sel" style="left:' + Math.round(seleccion.x * escala) +
         'px;width:' + Math.round(seleccion.ancho * escala) + 'px"></i>';
  }
  return h;
}

function reglaVertical(altoPieza, escala, seleccion) {
  var paso = pasoRegla(escala);
  var media = paso * 5;
  var mayor = paso * 10;
  var h = '';
  for (var y = 0; y <= altoPieza; y += paso) {
    var px = Math.round(y * escala);
    var clase = y % mayor === 0 ? 'marca marca--mayor' : (y % media === 0 ? 'marca marca--media' : 'marca');
    h += '<i class="' + clase + '" style="top:' + px + 'px"></i>';
    if (y % mayor === 0 && y > 0) h += '<i class="regla-n" style="top:' + px + 'px">' + y + '</i>';
  }
  if (seleccion) {
    h += '<i class="regla-sel" style="top:' + Math.round(seleccion.y * escala) +
         'px;height:' + Math.round(seleccion.alto * escala) + 'px"></i>';
  }
  return h;
}

<script>

var DESTINOS = [
  { id: 'inicio', n: 'Inicio', i: 'inicio', ruta: '/home' },

/* La única acción principal de todo el aplicativo */
function ctaCrear(alto) {
  return '<button class="cta cta--principal' + (alto ? ' cta--alto' : '') + '">' +
    ico('crear', 'ico--16') + 'Crear una pieza</button>';
}

function movilNav(activo) {
  return '<nav class="movil-nav">' + DESTINOS.map(function (d) {
    return '<div class="movil-nav__i' + (d.id === activo ? ' movil-nav__i--on' : '') + '">' +
      ico(d.i, 'ico--24') + '<span>' + d.n + '</span></div>';
  }).join('') + '</nav>';
}

/* ── A · Taller ──────────────────────────────────────────────────────── */

function marcoA(activo, titulo, cuerpo, accion) {
  return (
    '<div class="a-marco">' +
      '<aside class="a-lateral">' +
        '<div class="a-marca">' + LOGOS.a(34, '#ffffff', '#23366f') +
          '<div><div class="a-marca__n">Fast Creative Builder</div>' +
          '<div class="a-marca__l">Web · Email · Libre</div></div></div>' +
        '<nav class="a-grupo">' + DESTINOS.map(function (d) {

            ico(d.i) + '<span>' + d.n + '</span></div>';
        }).join('') + '</nav>' +
        '<div class="a-pie"><span class="avatar">AG</span>' +
          '<div class="crece"><div class="menor" style="font-weight:500">Andrés Gamonal</div>' +
          '<div class="micro" style="color:var(--azul-claro)">Administrador</div></div></div>' +
      '</aside>' +
      '<div class="a-principal">' +
        '<header class="a-barra">' +
          '<h4 class="crece">' + esc(titulo) + '</h4>' +
          '<button class="cta cta--bajo cta--terciario">' + ico('buscar', 'ico--16') + 'Buscar</button>' +

        '<div class="a-cuerpo">' + cuerpo + '</div>' +
        movilNav(activo) +
      '</div>' +
    '</div>'

}

<script>
/* editor_mockups_fast_creative_builder.js */
/* ═══════════════════════════════════════════════════════════════════════
   Editor — edición directa, reglas en píxeles reales y arrastre depurado
   ───────────────────────────────────────────────────────────────────────
   Correcciones pedidas:
     1. «Pongo el cursor en el texto y edito directo.» Se escribe sobre el
        lienzo. Lo frecuente vive en una barra pegada a la selección; el
        mapa de caja queda detrás de «Avanzado».
     2. «Líneas o reglas que me permitan ver los píxeles reales, preciso.»
        Regla horizontal y vertical que miden la PIEZA, no la pantalla.
        Si el lienzo se reduce para caber, la regla se reduce con él y el
        número sigue siendo el píxel real. Paso adaptativo para que nunca
        se apelmacen las marcas.
     3. Arrastre con umbral, línea de inserción, imantado con cota en
        píxeles y elección explícita entre insertar dentro o superponer.
   ═══════════════════════════════════════════════════════════════════════ */

/* Medidas reales de cada modo */
var PIEZA = {
  web:   { ancho: 1200, alto: 1480, n: 'Web · 1200 px' },
  email: { ancho: 600,  alto: 1400, n: 'Email · 600 px' },
  libre: { ancho: 1080, alto: 1080, n: 'Libre · 1080 × 1080' }
};

/* Ancho útil del lienzo en cada propuesta, ya descontados paneles y regla */
var UTIL = { a: 812, b: 1296, c: 1120 };

/* ── Lienzo envuelto en reglas ───────────────────────────────────────── */

function lienzoConReglas(modo, prop, contenido, sel, extras) {
  var pz = PIEZA[modo];
  var disponible = UTIL[prop];
  var escala = Math.min(1, disponible / pz.ancho);
  var w = Math.round(pz.ancho * escala);
  var h = Math.round(pz.alto * escala);

  return (
    '<div class="ed__lienzo">' +
      '<div class="zona-regla">' +
        '<div class="regla-esq">px</div>' +
        '<div class="regla-h" style="width:' + w + 'px">' + reglaHorizontal(pz.ancho, escala, sel) + '</div>' +
        '<div class="regla-v" style="height:' + h + 'px">' + reglaVertical(pz.alto, escala, sel) + '</div>' +
        '<div class="lienzo-area" style="width:' + w + 'px">' +
          '<div class="hoja-escala" style="width:' + w + 'px;height:' + h + 'px">' +
            '<div class="hoja" style="width:' + pz.ancho + 'px;transform:scale(' + escala + ')">' +
              contenido +
            '</div>' +
          '</div>' +
          (extras || '') +
        '</div>' +
      '</div>' +
      '<div class="zoom-chip">' + pz.n + ' · ' + Math.round(escala * 100) + '%</div>' +
    '</div>'
  );
}

/* ── Contenido de la pieza ───────────────────────────────────────────── */

function hoja(e) {
  e = e || {};
  return (
    '<section class="hoja__portada' + (e.sel === 'portada' ? ' sel' : '') + '">' +
      (e.sel === 'portada' ? '<span class="sel__et">Portada · Contenido sobre imagen</span>' : '') +
      '<div class="hoja__portada-txt">' +
        '<span class="etiqueta" style="color:var(--banda-lima)">Seguro de hogar</span>' +
        '<h2 class="' + (e.editando === 'titular' ? 'editando' : '') + '" style="color:#fff;font-size:38px">' +
          'Tu casa protegida desde el primer día' +
          (e.editando === 'titular' ? '<span class="cursor"></span>' : '') +
        '</h2>' +
        '<p style="color:var(--azul-claro);font-size:17px">Cobertura inmediata, sin trámites y con asistencia 24 horas en todo Chile.</p>' +
        '<div class="fila g3" style="margin-top:10px">' +
          '<span class="cta cta--conversion">Cotizar en un minuto</span>' +
          '<span class="cta" style="background:#fff;color:var(--navy)">Ver coberturas</span>' +
        '</div>' +
      '</div>' +
      '<img src="' + FOTO.pieza1 + '" alt="">' +
    '</section>' +

    '<section class="hoja__cifras' + (e.sel === 'cifras' ? ' sel' : '') + '">' +
      (e.sel === 'cifras' ? '<span class="sel__et">Métricas · 3 cifras</span>' : '') +
      '<div><b>24 h</b><span>Asistencia todos los días</span></div>' +
      '<div><b>0</b><span>Trámites en papel</span></div>' +
      '<div><b>1 min</b><span>Para cotizar</span></div>' +
    '</section>' +

    (e.insercion ? '<div class="linea-insercion"><span>Insertar aquí · y 664</span></div>' : '') +

    '<section class="hoja__texto' + (e.sel === 'texto' ? ' sel' : '') + '">' +
      (e.sel === 'texto' ? '<span class="sel__et">Texto enriquecido</span>' : '') +
      '<p class="' + (e.editando === 'texto' ? 'editando' : '') + '">' +
        'La póliza cubre incendio, robo, daños por agua y responsabilidad civil. ' +
        'Puedes ampliarla con contenido, bicicletas o equipos de trabajo cuando lo necesites.' +
        (e.editando === 'texto' ? '<span class="cursor"></span>' : '') +
      '</p>' +
    '</section>'
  );
}

/* Pieza de estilo libre: mesa de trabajo cuadrada */
function hojaLibre(e) {
  e = e || {};
  return (
    '<div class="mesa">' +
      '<img class="mesa__fondo" src="' + FOTO.pieza2 + '" alt="">' +

      '<span class="mesa__burbuja mesa__burbuja--2"></span>' +

}

function hojaEmail(e) {

  return (

          'Tu renovación está lista' + (e.editando === 'texto' ? '<span class="cursor"></span>' : '') + '</h3>' +
        '<p class="menor suave" style="margin-top:10px">Revisa las condiciones de tu póliza y renueva en línea antes del 30 de septiembre.</p>' +
        '<span class="cta cta--conversion" style="margin-top:18px">Renovar ahora</span>' +
      '</div>' +
      '<div class="email__pie"><span class="micro tenue">Zurich Chile · Av. Pedro de Valdivia 100, Providencia<br>Darse de baja · Preferencias</span></div>' +
    '</div>'

}

/* ── Barra flotante de edición ───────────────────────────────────────── */

function barraFlotante(arriba, izquierda) {
  return (
    '<div class="flotante" style="top:' + arriba + 'px;left:' + izquierda + 'px">' +
      '<span class="flotante__t">Título</span><span class="flotante__sep"></span>' +

      '<span class="flotante__sep"></span>' +
      '<button class="flotante__b flotante__b--on"><b>N</b></button>' +
      '<button class="flotante__b"><i>C</i></button>' +
      '<span class="flotante__sep"></span>' +
      '<button class="flotante__b">' + ico('alinIzq', 'ico--16') + '</button>' +
      '<button class="flotante__b">' + ico('alinCen', 'ico--16') + '</button>' +
      '<span class="flotante__sep"></span>' +
      '<button class="flotante__b"><span class="flotante__color"></span></button>' +
      '<button class="flotante__b">' + ico('enlace', 'ico--16') + '</button>' +
      '<span class="flotante__sep"></span>' +
      '<button class="flotante__b">' + ico('mas', 'ico--16') + '</button>' +
    '</div>'
  );
}

/* Lectura de posición y tamaño, siempre en píxeles de la pieza */
function lectura(arriba, izquierda, x, y, ancho, alto) {
  return (
    '<div class="lectura" style="top:' + arriba + 'px;left:' + izquierda + 'px">' +
      '<b><span>x</span> ' + x + '</b><b><span>y</span> ' + y + '</b>' +
      '<b>' + ancho + ' <span>×</span> ' + alto + '</b>' +
    '</div>'
  );
}

/* Cota de distancia entre dos elementos */
function cotaVertical(arriba, izquierda, altoPx, valor) {
  return (
    '<div class="cota cota--v" style="top:' + arriba + 'px;left:' + izquierda + 'px;height:' + altoPx + 'px">' +
      '<span class="cota__linea"></span><span class="cota__n">' + valor + '</span><span class="cota__linea"></span>' +
    '</div>'
  );
}

function guiaVertical(izquierda, valor) {
  return '<div class="guia guia--v" style="left:' + izquierda + 'px"><span class="guia__n">x ' + valor + '</span></div>';
}

/* ── Paneles ─────────────────────────────────────────────────────────── */

function panelComponentes(arrastrando) {
  return CATALOGO.map(function (g) {
    return (
      '<div style="margin-bottom:var(--e5)">' +
        '<div class="etiqueta tenue" style="padding:0 var(--e2) var(--e2)">' + g.g + '</div>' +
        g.c.map(function (c, i) {
          var act = arrastrando && g.g === 'Contenido' && i === 1 ? ' comp--arrastrando' : '';
          return (
            '<div class="comp' + act + '"><span class="comp__ico">' + ico(c.i, 'ico--16') + '</span>' +
            '<div class="crece"><div class="comp__n">' + c.n + '</div><div class="comp__d">' + c.d + '</div></div>' +
            ico('agarre', 'ico--16') + '</div>'
          );
        }).join('') +
      '</div>'
    );
  }).join('');
}

function panelSeccion(avanzado) {
  if (avanzado) {
    return (
      '<div class="lat__tabs"><span class="lat__tab">Contenido</span><span class="lat__tab lat__tab--on">Avanzado</span></div>' +
      '<div class="lat__c">' +
        '<div class="etiqueta tenue" style="margin-bottom:var(--e3)">Espaciado exacto</div>' +
        '<div class="caja-mapa"><span class="caja-mapa__et">margen</span>' +
          '<input class="caja-mapa__v" value="0">' +
          '<div class="caja-mapa__p"><span class="caja-mapa__et">relleno</span>' +
          '<div class="caja-mapa__c">Contenido</div></div></div>' +
        '<p class="campo__ayuda" style="margin:var(--e3) 0 var(--e5)">Todo nace en cero. Si ves separación, está escrita aquí.</p>' +
        '<div class="col g4">' +
          '<label class="campo"><span class="campo__et">Ancho máximo</span><input class="campo__in" value="auto"></label>' +
          '<label class="campo"><span class="campo__et">Ancla</span><input class="campo__in" placeholder="portada"></label>' +
        '</div>' +
      '</div>'
    );
  }
  return (
    '<div class="lat__tabs"><span class="lat__tab lat__tab--on">Contenido</span><span class="lat__tab">Avanzado</span></div>' +
    '<div class="lat__c">' +
      '<div class="etiqueta tenue" style="margin-bottom:var(--e3)">Esta sección</div>' +
      '<div class="col g5">' +
        '<div><span class="campo__et" style="display:block;margin-bottom:var(--e2)">Fondo</span>' +
          '<div class="fila g2" style="flex-wrap:wrap">' +
            ['var(--navy)','var(--banda-rosa)','var(--banda-celeste)','var(--banda-menta)','var(--banda-ambar)','var(--banda-arenisca)','#ffffff']
              .map(function (c, i) { return '<span class="muestra' + (i === 0 ? ' muestra--on' : '') + '" style="background:' + c + '"></span>'; }).join('') +
          '</div></div>' +
        '<div><span class="campo__et" style="display:block;margin-bottom:var(--e2)">Imagen</span>' +
          '<div class="campo-img"><img src="' + FOTO.pieza1 + '" alt="">' +

        '<div><span class="campo__et" style="display:block;margin-bottom:var(--e2)">Disposición</span>' +
          '<div class="opciones"><span class="opcion opcion--on">Texto izquierda</span><span class="opcion">Texto derecha</span>' +
          '<span class="opcion">Centrado</span><span class="opcion">Sobre la imagen</span></div></div>' +
        '<div><span class="campo__et" style="display:block;margin-bottom:var(--e2)">Alto</span>' +
          '<div class="opciones"><span class="opcion">Ajustar</span><span class="opcion opcion--on">Cómodo</span>' +
          '<span class="opcion">Amplio</span></div></div>' +
      '</div>' +
    '</div>'
  );
}

function panelCapas() {
  var items = [
    { n: 'Portada', d: 0, on: true }, { n: 'Título', d: 1 }, { n: 'Texto', d: 1 },
    { n: 'Botones', d: 1 }, { n: 'Métricas', d: 0 }, { n: 'Texto enriquecido', d: 0 }
  ];
  return items.map(function (i) {
    return '<div class="capa' + (i.on ? ' capa--on' : '') + '" style="padding-left:' + (10 + i.d * 16) + 'px">' +

  }).join('');
}

function barraEditor(modo, oscuro) {
  var sec = oscuro ? 'style="background:rgba(255,255,255,.16);color:#fff"' : '';
  return (
    '<button class="cta cta--bajo cta--terciario" ' + (oscuro ? 'style="color:#fff"' : '') + '>' + ico('atras', 'ico--16') + 'Proyectos</button>' +
    '<div style="font-weight:600;font-size:14px">' + (modo === 'email' ? 'Renovación auto — correo' : modo === 'libre' ? 'Cobertura viaje — pieza' : 'Seguro de hogar — landing') + '</div>' +
    '<span class="pastilla pastilla--neutra"><span class="punto"></span>Guardado</span>' +
    '<div class="crece"></div>' +
    '<div class="grupo-disp">' +
      '<span class="grupo-disp__b grupo-disp__b--on">' + ico('escritorio', 'ico--16') + '</span>' +
      '<span class="grupo-disp__b">' + ico('tableta', 'ico--16') + '</span>' +
      '<span class="grupo-disp__b">' + ico('movil', 'ico--16') + '</span>' +

    '<button class="cta cta--bajo" ' + sec + '>' + ico('deshacer', 'ico--16') + '</button>' +
    '<button class="cta cta--bajo" ' + sec + '>' + ico('rehacer', 'ico--16') + '</button>' +
    '<button class="cta cta--bajo cta--secundario">' + ico('ojo', 'ico--16') + 'Previsualizar</button>' +
    '<button class="cta cta--bajo cta--principal">' + ico('exportar', 'ico--16') + 'Exportar</button>'
  );
}

function contenidoModo(modo, estado) {
  if (modo === 'libre') return hojaLibre(estado);
  if (modo === 'email') return hojaEmail(estado);
  return hoja(estado);
}

/* ═══ A · Taller ════════════════════════════════════════════════════════ */

function editorA(modo) {
  var esc = Math.min(1, UTIL.a / PIEZA[modo].ancho);
  /* La barra va ENCIMA de la selección, no sobre el texto. La lectura de
     medidas va debajo, para que nunca se tapen entre ellas. */
  var sel = { x: 80, y: 150, ancho: 560, alto: 132 };
  var extras =
    barraFlotante(Math.round(sel.y * esc) - 50, Math.round(sel.x * esc)) +
    lectura(Math.round((sel.y + sel.alto) * esc) + 8, Math.round(sel.x * esc), sel.x, sel.y, sel.ancho, sel.alto) +
    cotaVertical(Math.round(490 * esc), Math.round(24 * esc), Math.round(40 * esc), '40');

  return (
    '<div class="ed-marco">' +
      '<header class="ed-barra">' + barraEditor(modo) + '</header>' +
      '<div class="ed ed--a">' +
        '<aside class="ed__panel"><div class="ed__panel-t">Componentes</div>' +
          '<div class="ed__panel-c">' + panelComponentes(false) + '</div></aside>' +
        lienzoConReglas(modo, 'a', contenidoModo(modo, { sel: 'portada', editando: 'titular' }), sel, extras) +
        '<aside class="ed__panel">' + panelSeccion(false) + '</aside>' +
      '</div>' +
    '</div>'
  );
}

/* ═══ B · Lienzo ════════════════════════════════════════════════════════ */

function editorB(modo) {
  var esc = Math.min(1, UTIL.b / PIEZA[modo].ancho);
  var selB = { x: 40, y: 760, ancho: 1120, alto: 96 };
  var extras =
    guiaVertical(Math.round(40 * esc), 40) +
    guiaVertical(Math.round(1160 * esc), 1160) +
    barraFlotante(Math.round(selB.y * esc) - 50, Math.round(selB.x * esc)) +
    lectura(Math.round((selB.y + selB.alto) * esc) + 8, Math.round(selB.x * esc), selB.x, selB.y, selB.ancho, selB.alto);

  return (
    '<div class="ed-marco">' +
      '<header class="ed-barra">' + barraEditor(modo) + '</header>' +
      '<div class="ed ed--b">' +
        '<aside class="ed-riel">' +
          '<span class="ed-riel__b ed-riel__b--on">' + ico('mas', 'ico--24') + '</span>' +
          '<span class="ed-riel__b">' + ico('capas', 'ico--24') + '</span>' +
          '<span class="ed-riel__b">' + ico('biblioteca', 'ico--24') + '</span>' +
          '<span class="ed-riel__b">' + ico('regla', 'ico--24') + '</span>' +
        '</aside>' +
        lienzoConReglas(modo, 'b', contenidoModo(modo, { sel: 'texto', editando: 'texto', insercion: true }), selB, extras) +
        '<aside class="ed-flotante ed-flotante--izq">' +
          '<div class="ed__panel-t">Componentes<div class="crece"></div>' + ico('cerrar', 'ico--16') + '</div>' +
          '<div class="ed__panel-c">' + panelComponentes(true) + '</div>' +
        '</aside>' +
        '<div class="eleccion-soltar"><b>Suéltalo aquí</b>' +
          '<div class="fila g2"><span class="cta cta--bajo cta--principal">Insertar dentro</span>' +
          '<span class="cta cta--bajo cta--secundario">Superponer encima</span></div></div>' +
      '</div>' +
    '</div>'
  );
}

/* ═══ C · Escritorio ════════════════════════════════════════════════════ */

function editorC(modo) {
  var esc = Math.min(1, UTIL.c / PIEZA[modo].ancho);
  var selC = { x: 40, y: 420, ancho: 1120, alto: 200 };
  var extras = lectura(Math.round((selC.y + selC.alto) * esc) + 8, Math.round(selC.x * esc),
    selC.x, selC.y, selC.ancho, selC.alto);

  return (
    '<div class="ed-marco">' +
      '<header class="ed-barra ed-barra--navy">' + barraEditor(modo, true) + '</header>' +
      '<div class="ed-props">' +
        '<span class="ed-props__q">' + ico('datos', 'ico--16') + 'Métricas</span>' +
        '<span class="ed-props__sep"></span>' +
        '<span class="ed-props__g"><span class="menor tenue">Columnas</span>' +
          '<span class="opciones"><span class="opcion">2</span><span class="opcion opcion--on">3</span><span class="opcion">4</span></span></span>' +
        '<span class="ed-props__g"><span class="menor tenue">Separación</span><button class="flotante__b">−</button>' +
          '<span class="flotante__v">16</span><button class="flotante__b">+</button></span>' +
        '<span class="ed-props__g"><span class="menor tenue">Relleno</span><button class="flotante__b">−</button>' +
          '<span class="flotante__v">40</span><button class="flotante__b">+</button></span>' +
        '<span class="ed-props__g"><button class="flotante__b"><span class="flotante__color"></span></button></span>' +
        '<div class="crece"></div>' +
        '<span class="ed-props__ruta">Página › Métricas</span>' +
      '</div>' +
      '<div class="ed ed--c">' +
        '<aside class="ed__panel">' +
          '<div class="lat__tabs"><span class="lat__tab lat__tab--on">Capas</span><span class="lat__tab">Componentes</span></div>' +
          '<div class="ed__panel-c" style="padding:var(--e2)">' + panelCapas() + '</div>' +
        '</aside>' +
        lienzoConReglas(modo, 'c', contenidoModo(modo, { sel: 'cifras', editando: 'titular' }), selC, extras) +
      '</div>' +
    '</div>'
  );
}

var EDITOR = { a: editorA, b: editorB, c: editorC };

</script>
<script>
/* interiores_mockups_fast_creative_builder.js */
/* ═══════════════════════════════════════════════════════════════════════
   Acceso, pantallas interiores y modales
   ═══════════════════════════════════════════════════════════════════════ */

function envolver(prop, cfg) {
  var cabecera =
    '<section class="banda banda--corta banda--' + (cfg.banda || 'hueso') + '">' +
      '<div class="contenedor fila g5 fila--apila" style="align-items:flex-end">' +
        '<div class="crece">' +
          (cfg.migas ? '<span class="etiqueta tenue">' + cfg.migas + '</span>' : '') +
          '<h1 style="margin-top:' + (cfg.migas ? 'var(--e2)' : '0') + '">' + esc(cfg.titulo) + '</h1>' +
          (cfg.bajada ? '<p class="lead" style="margin-top:var(--e3);max-width:60ch">' + esc(cfg.bajada) + '</p>' : '') +
        '</div>' +
        (cfg.accion || '') +
      '</div>' +
    '</section>';

  var contenido =
    cabecera +
    '<section class="banda banda--corta banda--blanca"><div class="contenedor">' +
      (cfg.pestanas || '') + cfg.cuerpo +
    '</div></section>';

  if (prop === 'a') return marcoA(cfg.activo, cfg.titulo, contenido);
  if (prop === 'b') return marcoB(cfg.activo, contenido);
  return marcoC(cfg.activo, contenido);
}

function pestanas(items, activa) {
  return '<div class="fila g1" style="background:var(--banda-hueso);padding:4px;border-radius:var(--pildora);margin-bottom:var(--e6);display:inline-flex">' +
    items.map(function (t) {
      var on = t === activa;
      return '<span class="cta cta--bajo" style="background:' + (on ? 'var(--papel)' : 'transparent') +
        ';color:' + (on ? 'var(--navy)' : 'var(--tinta-suave)') + '">' + esc(t) + '</span>';
    }).join('') + '</div>';
}

function campo(et, tipo, valor, ayuda) {
  return '<label class="campo"><span class="campo__et">' + esc(et) + '</span>' +
    '<input class="campo__in" type="' + tipo + '" value="' + esc(valor || '') + '">' +
    (ayuda ? '<span class="campo__ayuda">' + esc(ayuda) + '</span>' : '') + '</label>';

/* ═══ Acceso ════════════════════════════════════════════════════════════

   pastel. Ninguna tarjeta flotando sobre un fondo plano.               */

var VISUAL_LOGIN = {
  a: { clase: 'ambar', foto: 'loginA', alt: 'Persona trabajando en su puesto en casa' },
  b: { clase: 'celeste', foto: 'loginB', alt: 'Dos personas trabajando junto a la ventana' },

};

function ladoVisual(prop, mensaje) {
  var v = VISUAL_LOGIN[prop];
  return (
    '<div class="login__visual login__visual--' + v.clase + '">' +
      circuloFoto(FOTO[v.foto], 300, 'var(--papel)') +
      (mensaje
        ? '<div class="login__pie-msg"><span class="etiqueta">' + mensaje.et + '</span>' +
          '<h3 style="margin-top:var(--e2)">' + mensaje.t + '</h3></div>'

}

function panelAcceso(prop, titulo, intro, campos, boton, pie) {
  return (
    '<div class="login__panel"><div class="login__forma">' +
      '<div style="margin-bottom:var(--e4)">' + LOGOS[prop](46, '#2167ae', '#ffffff') + '</div>' +
      '<h2>' + esc(titulo) + '</h2>' +
      '<p class="suave" style="margin-bottom:var(--e2)">' + esc(intro) + '</p>' +

      (pie || '') +

}

function pLogin(prop) {
  var visual = ladoVisual(prop, { et: 'Una pieza, tres salidas', t: 'Diseña una vez y expórtalo en web, correo y gráfica.' });
  var panel = panelAcceso(prop, 'Entrar', 'Escribe tu correo y tu contraseña.',

}

function pInvitacion(prop) {
  var visual = ladoVisual(prop, { et: 'Primer acceso', t: 'El enlace caduca en siete días y sólo se usa una vez.' });

      campo('Repite la contraseña', 'password', ''),

}

function pRecuperar(prop) {
  var visual = ladoVisual(prop, null);
  var panel = panelAcceso(prop, 'Recuperar acceso',

  return '<div class="login login--' + prop + '">' + orden + '</div>';

/* ═══ Crear ═════════════════════════════════════════════════════════════ */

function pCrear(prop) {
  return envolver(prop, {
    activo: 'inicio', banda: 'hueso', titulo: 'Elige el modo',
    bajada: 'Los tres comparten el mismo catálogo y las mismas exportaciones. Lo que cambia son las reglas de construcción.',
    cuerpo: selectorModos() +

/* ═══ Proyectos ═════════════════════════════════════════════════════════ */

function pProyectos(prop) {

      '<button class="cta cta--secundario">Modo' + ico('abajo', 'ico--16') + '</button>' +

            '<td><button class="cta cta--bajo cta--secundario">Restaurar</button></td></tr>' +

function pPapelera(prop) {

      '<button class="cta cta--bajo cta--peligro">Eliminar</button></div></td></tr>' +

  return envolver(prop, { activo: 'proyectos', banda: 'hueso', migas: 'Proyectos', titulo: 'Papelera', cuerpo: cuerpo });
}

/* ═══ Biblioteca ════════════════════════════════════════════════════════ */

  if (tipo === 'Imágenes') {
    var fotos = [FOTO.pieza1, FOTO.pieza2, FOTO.home, FOTO.loginA, FOTO.loginB, FOTO.loginC];

        '<img src="' + fotos[i % fotos.length] + '" alt="" style="width:100%;height:140px;object-fit:cover">' +
        '<figcaption class="menor" style="padding:var(--e3)">imagen_' + (i + 1) + '.jpg' +

        return '<figure style="border-radius:var(--radio);overflow:hidden;background:var(--banda-hueso)">' +

/* ═══ Índice ════════════════════════════════════════════════════════════ */

var PANTALLAS = [
  { id: 'login', n: 'Acceso', ruta: '/login', g: 'Acceso', f: pLogin },
  { id: 'invitacion', n: 'Invitación', ruta: '/invitacion/:token', g: 'Acceso', f: pInvitacion },
  { id: 'recuperar', n: 'Recuperar acceso', ruta: '/recuperar', g: 'Acceso', f: pRecuperar },

  { id: 'home', n: 'Inicio', ruta: '/home', g: 'Trabajo', f: function (p) { return HOME[p](); } },
  { id: 'crear', n: 'Crear', ruta: '/crear', g: 'Trabajo', f: pCrear },
  { id: 'proyectos', n: 'Proyectos', ruta: '/proyectos', g: 'Trabajo', f: pProyectos },
  { id: 'ficha', n: 'Ficha de proyecto', ruta: '/proyectos/:id', g: 'Trabajo', f: pFicha },
  { id: 'papelera', n: 'Papelera', ruta: '/proyectos/papelera', g: 'Trabajo', f: pPapelera },

  { id: 'editor-web', n: 'Editor web', ruta: '/crear/web/:id', g: 'Editor', f: function (p) { return EDITOR[p]('web'); } },
  { id: 'editor-email', n: 'Editor email', ruta: '/crear/email/:id', g: 'Editor', f: function (p) { return EDITOR[p]('email'); } },
  { id: 'editor-libre', n: 'Editor libre', ruta: '/crear/libre/:id', g: 'Editor', f: function (p) { return EDITOR[p]('libre'); } },
  { id: 'exportar', n: 'Exportar', ruta: '/crear/web/:id · modal', g: 'Editor', f: pExportar },
  { id: 'insercion', n: 'Insertar contenido', ruta: '/crear/web/:id · modal', g: 'Editor', f: pInsercion },

  { id: 'bib-img', n: 'Biblioteca · imágenes', ruta: '/biblioteca/imagenes', g: 'Biblioteca', f: function (p) { return pBiblioteca(p, 'Imágenes'); } },
  { id: 'bib-logos', n: 'Biblioteca · logos', ruta: '/biblioteca/logos', g: 'Biblioteca', f: function (p) { return pBiblioteca(p, 'Logos'); } },
  { id: 'bib-tipo', n: 'Biblioteca · tipografías', ruta: '/biblioteca/tipografias', g: 'Biblioteca', f: function (p) { return pBiblioteca(p, 'Tipografías'); } },

  { id: 'cfg-general', n: 'Configuración general', ruta: '/configuracion/general', g: 'Configuración', f: pConfigGeneral },

  { id: 'cfg-usuarios', n: 'Usuarios', ruta: '/configuracion/usuarios', g: 'Configuración', f: pConfigUsuarios }
];

</script>
<script>
var PROPUESTAS = [
  {
    id: 'a',
    n: 'A · Taller',
    d: 'Barra lateral de destinos y barra superior de acciones. La ruta de selección siempre visible bajo la barra. Densidad media, orientada a trabajar rápido.'
  },
  {
    id: 'b',
    n: 'B · Lienzo',
    d: 'Riel de íconos y paneles flotantes. El home abre por búsqueda. En el editor el inspector se ancla junto a la selección y el lienzo ocupa toda la pantalla.'
  },
  {
    id: 'c',
    n: 'C · Escritorio',
    d: 'Barra superior ancha con secciones, sin lateral. El home abre con el resumen operativo. Las propiedades van en una barra horizontal, no en un panel.'
  }
];

var TAMANOS = {
  escritorio: { w: 1440, h: 900 },
  tableta: { w: 834, h: 1100 },
  movil: { w: 390, h: 844 }
};

var estado = { propuesta: 'a', pantalla: 'login', dispositivo: 'escritorio', cuadricula: false, solo: false };

function pintarPropuestas() {
  document.getElementById('props').innerHTML = PROPUESTAS.map(function (p) {
    return (
      '<button class="v-prop" data-prop="' + p.id + '" aria-pressed="' + (p.id === estado.propuesta) + '">' +
      '<b>' + p.n + '</b><span>' + p.d + '</span></button>'
    );
  }).join('');
}

function pintarLista() {
  var html = '';
  var grupo = null;
  PANTALLAS.forEach(function (s) {
    if (s.g !== grupo) { grupo = s.g; html += '<div class="v-grupo">' + grupo + '</div>'; }
    html +=
      '<button class="v-item" data-pant="' + s.id + '" aria-current="' + (s.id === estado.pantalla) + '">' +
      s.n + '<small>' + s.ruta + '</small></button>';
  });
  document.getElementById('lista').innerHTML = html;
}

function pantallaActual() {
  for (var i = 0; i < PANTALLAS.length; i++) if (PANTALLAS[i].id === estado.pantalla) return PANTALLAS[i];
  return PANTALLAS[0];
}

function pintar() {
  var s = pantallaActual();
  var t = TAMANOS[estado.dispositivo];
  var marco = document.getElementById('marco');
  var lienzo = document.getElementById('pantalla');

  document.getElementById('tituloPantalla').textContent = s.n;
  document.getElementById('rutaPantalla').textContent = s.ruta;

  marco.style.width = t.w + 'px';
  marco.style.height = t.h + 'px';

  lienzo.className = 'p' + (estado.dispositivo === 'movil' ? ' movil' : '') + (estado.cuadricula ? ' mostrar-cuadricula' : '');
  lienzo.setAttribute('data-propuesta', estado.propuesta);
  lienzo.innerHTML =
    s.f(estado.propuesta) +
    (estado.cuadricula
      ? '<div class="cuadricula">' + new Array(13).join('<span></span>') + '</div>'
      : '');

  // Escala para que la maqueta quepa en la ventana sin recortarse
  var escena = document.querySelector('.v-escena');
  var holgura = estado.solo ? 0 : 56;
  var dispW = escena.clientWidth - holgura;
  var dispH = escena.clientHeight - holgura;
  var escala = Math.min(1, dispW / t.w, dispH / t.h);
  marco.style.transform = 'scale(' + escala + ')';
  marco.style.marginBottom = -(t.h * (1 - escala)) + 'px';

  var p = PROPUESTAS.filter(function (x) { return x.id === estado.propuesta; })[0];
  document.getElementById('notas').innerHTML =
    '<b>' + p.n + '</b> · ' + p.d +
    ' &nbsp;—&nbsp; Escala ' + Math.round(escala * 100) + '% sobre ' + t.w + '×' + t.h + '. ' +
    'Las fotografías son vistas previas de Envato con marca de agua; los archivos licenciados se sustituyen al cierre.';
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.prop) { estado.propuesta = b.dataset.prop; pintarPropuestas(); pintar(); }
  else if (b.dataset.pant) { estado.pantalla = b.dataset.pant; pintarLista(); pintar(); }
  else if (b.dataset.disp) {
    estado.dispositivo = b.dataset.disp;
    document.querySelectorAll('[data-disp]').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x.dataset.disp === estado.dispositivo));
    });
    pintar();
  } else if (b.id === 'btnSolo') {
    estado.solo = !estado.solo;
    b.setAttribute('aria-pressed', String(estado.solo));
    document.body.classList.toggle('solo', estado.solo);
    pintar();
  } else if (b.id === 'btnCuadricula') {
    estado.cuadricula = !estado.cuadricula;
    b.setAttribute('aria-pressed', String(estado.cuadricula));
    pintar();
  }
});

window.addEventListener('resize', pintar);

pintarPropuestas();
pintarLista();
pintar();
</script>
