<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>refuta-sel</title>
<link rel="stylesheet" href="sistema_mockups_fast_creative_builder.css">
<link rel="stylesheet" href="propuestas_mockups_fast_creative_builder.css">
<style>html,body{margin:0}#marco{overflow:hidden;background:#fff}
#out{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;color:#0f0;font:12px monospace;z-index:99999;overflow:auto;margin:0;padding:8px;white-space:pre-wrap}</style>
</head><body>
<div id="marco" class="p"></div>
<pre id="out">midiendo...</pre>
<script src="base_mockups_fast_creative_builder.js"></script>
<script src="pantallas_mockups_fast_creative_builder.js"></script>
<script src="editor_mockups_fast_creative_builder.js"></script>
<script src="interiores_mockups_fast_creative_builder.js"></script>
<script>
var TAMX = { escritorio:{w:1440,h:900}, tableta:{w:834,h:1100}, movil:{w:390,h:844} };
function rend(prop, modo, disp) {
  var mk = document.getElementById('marco'), t = TAMX[disp];
  mk.className = 'p' + (disp==='movil'?' movil':'') + (disp==='tableta'?' tableta':'');
  mk.style.width = t.w+'px'; mk.style.height = t.h+'px';
  mk.innerHTML = EDITOR[prop](modo);
  ajustarLienzos(mk);
}
function esperaImgs(mk){
  var imgs = Array.prototype.slice.call(mk.querySelectorAll('img'));
  return Promise.all(imgs.map(function(i){ return i.complete ? null : new Promise(function(r){ i.onload=i.onerror=r; }); }));
}
function medir(prop,modo,disp){
  var mk=document.getElementById('marco');
  rend(prop,modo,disp);
  return esperaImgs(mk).then(function(){
    return new Promise(function(r){ setTimeout(r,120); });
  }).then(function(){
    ajustarLienzos(mk);
    var l=mk.querySelector('.ed__lienzo'), pz=PIEZA[modo];
    var caja=l.querySelector('.hoja-escala').getBoundingClientRect();
    var esc=caja.width/pz.ancho;
    var o={ caso:prop+'/'+modo+'/'+disp, escala:+esc.toFixed(4) };
    var s=l.querySelector('.sel');
    if(s){ var r=s.getBoundingClientRect();
      o.elemento=s.className.replace(' sel','').trim();
      o.elem_en_pieza=[+((r.left-caja.left)/esc).toFixed(1),+((r.top-caja.top)/esc).toFixed(1),+(r.width/esc).toFixed(1),+(r.height/esc).toFixed(1)];
    } else { o.elemento='NINGUNO — no hay .sel en el DOM'; }
    var lit=JSON.parse(l.getAttribute('data-sel'));
    o.literal_sel=[lit.x,lit.y,lit.ancho,lit.alto];
    var bh=l.querySelector('.regla-h .regla-sel'), bv=l.querySelector('.regla-v .regla-sel');
    if(bh) o.banda_h_px=[+parseFloat(bh.style.left).toFixed(1), +(parseFloat(bh.style.left)+parseFloat(bh.style.width)).toFixed(1)];
    if(bv) o.banda_v_px=[+parseFloat(bv.style.top).toFixed(1), +(parseFloat(bv.style.top)+parseFloat(bv.style.height)).toFixed(1)];
    var rh=l.querySelector('.regla-h'); if(rh) o.regla_h_ancho_px=+rh.getBoundingClientRect().width.toFixed(1);
    var lec=l.querySelector('.lectura'); if(lec) o.lectura=lec.textContent.replace(/\s+/g,' ').trim();
    var h2=l.querySelector('.hoja__portada-txt h2');
    if(h2){ var q=h2.getBoundingClientRect(); o.h2_en_pieza=[+((q.left-caja.left)/esc).toFixed(1),+((q.top-caja.top)/esc).toFixed(1),+(q.width/esc).toFixed(1),+(q.height/esc).toFixed(1)]; }
    return o;
  });
}
var casos=[];
['a','b','c'].forEach(function(p){ ['web','email','libre'].forEach(function(mo){ casos.push([p,mo,'escritorio']); }); });
casos.push(['b','web','tableta']); casos.push(['b','web','movil']);
var res=[];
casos.reduce(function(cad,c){
  return cad.then(function(){ return medir(c[0],c[1],c[2]); }).then(function(o){ res.push(o); });
}, Promise.resolve()).then(function(){
  window.RES=res;
  document.getElementById('out').textContent='RESULTADO\n'+JSON.stringify(res,null,1);
}).catch(function(e){ document.getElementById('out').textContent='ERROR '+e; });
</script></body></html>
