<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="sistema_mockups_fast_creative_builder.css">
<link rel="stylesheet" href="propuestas_mockups_fast_creative_builder.css">
<style>html,body{margin:0}#marco{overflow:hidden;background:#fff}</style>
</head><body>
<div id="marco" class="p"></div>
<pre id="out" style="position:fixed;right:0;top:0;background:#000;color:#0f0;font:11px monospace;z-index:9999;max-height:100vh;overflow:auto"></pre>
<script src="base_mockups_fast_creative_builder.js"></script>
<script src="pantallas_mockups_fast_creative_builder.js"></script>
<script src="editor_mockups_fast_creative_builder.js"></script>
<script src="interiores_mockups_fast_creative_builder.js"></script>
<script>
var TAMX = { escritorio:{w:1440,h:900}, tableta:{w:834,h:1100}, movil:{w:390,h:844} };
function render(prop, modo, disp) {
  disp = disp || 'escritorio';
  var m = document.getElementById('marco'), t = TAMX[disp];
  m.className = 'p' + (disp==='movil'?' movil':'') + (disp==='tableta'?' tableta':'');
  m.style.width = t.w+'px'; m.style.height = t.h+'px';
  m.innerHTML = EDITOR[prop](modo);
  if (typeof ajustarLienzos === 'function') ajustarLienzos(m);
}
function medir(prop, modo, disp) {
  render(prop, modo, disp);
  var m = document.getElementById('marco');
  var lienzo = m.querySelector('.ed__lienzo');
  var pz = PIEZA[modo];
  var hojaEl = lienzo.querySelector('.hoja');
  var hojaR = hojaEl.getBoundingClientRect();
  var caja = lienzo.querySelector('.hoja-escala').getBoundingClientRect();
  var escala = caja.width / pz.ancho;
  var selEl = lienzo.querySelector('.sel');
  var r = { prop:prop, modo:modo, disp:disp, escala:+escala.toFixed(4) };
  if (selEl) {
    var s = selEl.getBoundingClientRect();
    r.selClase = selEl.className.replace(' sel','');
    r.elemPieza = {
      x: +((s.left - caja.left)/escala).toFixed(1),
      y: +((s.top - caja.top)/escala).toFixed(1),
      w: +(s.width/escala).toFixed(1),
      h: +(s.height/escala).toFixed(1)
    };
  }
  var crudo = lienzo.getAttribute('data-sel');
  r.literal = crudo ? JSON.parse(crudo) : null;
  // banda de la regla, reconvertida a pixeles de pieza
  var bh = lienzo.querySelector('.regla-h .regla-sel');
  var bv = lienzo.querySelector('.regla-v .regla-sel');
  if (bh) r.bandaH = { xPieza: +(parseFloat(bh.style.left)/escala).toFixed(1), wPieza: +(parseFloat(bh.style.width)/escala).toFixed(1) };
  if (bv) r.bandaV = { yPieza: +(parseFloat(bv.style.top)/escala).toFixed(1), hPieza: +(parseFloat(bv.style.height)/escala).toFixed(1) };
  var lect = lienzo.querySelector('.lectura');
  if (lect) r.lectura = lect.textContent.replace(/\s+/g,' ').trim();
  // recorte de la banda horizontal contra el ancho de la regla
  var rh = lienzo.querySelector('.regla-h');
  if (rh && bh) r.reglaHancho = +rh.getBoundingClientRect().width.toFixed(1),
                r.bandaHfinPx = +(parseFloat(bh.style.left)+parseFloat(bh.style.width)).toFixed(1);
  return r;
}
var res = [];
['a','b','c'].forEach(function(p){ ['web','email','libre'].forEach(function(mo){ res.push(medir(p,mo,'escritorio')); }); });
res.push(medir('b','web','tableta'));
res.push(medir('b','web','movil'));
window.RES = res;
document.getElementById('out').textContent = JSON.stringify(res,null,1);
</script></body></html>
