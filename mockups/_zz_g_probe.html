<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="sistema_mockups_fast_creative_builder.css">
<link rel="stylesheet" href="propuestas_mockups_fast_creative_builder.css">
<style>html,body{margin:0}#marcoG{overflow:hidden;background:#fff}</style>
</head><body>
<div id="marcoG" class="p"></div>
<script src="base_mockups_fast_creative_builder.js"></script>
<script src="pantallas_mockups_fast_creative_builder.js"></script>
<script src="editor_mockups_fast_creative_builder.js"></script>
<script src="interiores_mockups_fast_creative_builder.js"></script>
<script>
var TAMG = { escritorio:{w:1440,h:900}, tableta:{w:834,h:1100}, movil:{w:390,h:844} };
function r1(v){ return Math.round(v*10)/10; }

function pintarG(prop, modo, disp) {
  var m = document.getElementById('marcoG'), t = TAMG[disp];
  m.className = 'p' + (disp==='movil'?' movil':'') + (disp==='tableta'?' tableta':'');
  m.style.width = t.w+'px'; m.style.height = t.h+'px';
  m.innerHTML = EDITOR[prop](modo);
  ajustarLienzos(m);
}

function medirG(prop, modo, disp) {
  var m = document.getElementById('marcoG');
  var l = m.querySelector('.ed__lienzo[data-modo]');
  var pz = PIEZA[modo];
  var caja = l.querySelector('.hoja-escala');
  var cr = caja.getBoundingClientRect();
  var escala = cr.width / pz.ancho;
  var o = { id: prop+'/'+modo+'/'+disp, esc: r1(escala*100)+'%' };
  var selEl = l.querySelector('.sel');
  if (selEl) {
    var sr = selEl.getBoundingClientRect();
    o.elem = selEl.className.split(' ')[0];
    o.elemPieza = { x0:r1((sr.left-cr.left)/escala), x1:r1((sr.right-cr.left)/escala),
                    y0:r1((sr.top-cr.top)/escala), y1:r1((sr.bottom-cr.top)/escala) };
  } else o.elem = 'NINGUNO';
  var lit = l.getAttribute('data-sel');
  o.literal = lit ? JSON.parse(lit) : null;
  var bv = l.querySelector('.regla-v .regla-sel');
  var rvEl = l.querySelector('.regla-v');
  if (bv) { var rv = rvEl.getBoundingClientRect(), br = bv.getBoundingClientRect();
    o.bandaV = { y0:r1((br.top-rv.top)/escala), y1:r1((br.bottom-rv.top)/escala), altoReglaPx:r1(rv.height) }; }
  var bh = l.querySelector('.regla-h .regla-sel');
  var rhEl = l.querySelector('.regla-h');
  if (bh) { var rh = rhEl.getBoundingClientRect(), bhr = bh.getBoundingClientRect();
    o.bandaH = { x0:r1((bhr.left-rh.left)/escala), x1:r1((bhr.right-rh.left)/escala),
                 anchoReglaPx:r1(rh.width), cssLeft:bh.style.left, cssWidth:bh.style.width,
                 ovf:getComputedStyle(rhEl).overflow, anchoVisiblePx:r1(bhr.width) }; }
  var lec = l.querySelector('.lectura');
  if (lec) o.lectura = lec.textContent.replace(/\s+/g,' ').trim();
  var barra = l.querySelector('.flotante');
  if (barra) { var bb = barra.getBoundingClientRect(); o.barraTopPieza = r1((bb.top-cr.top)/escala); }
  o.imgsNaturalW = [].slice.call(m.querySelectorAll('img')).map(function(i){ return i.naturalWidth; }).join(',');
  o.altoHojaPieza = r1(l.querySelector('.hoja').getBoundingClientRect().height/escala);
  return o;
}

(function () {
  var combos = [];
  ['a','b','c'].forEach(function(p){ ['web','email','libre'].forEach(function(mo){ combos.push([p,mo,'escritorio']); }); });
  combos.push(['b','web','tableta']); combos.push(['b','web','movil']);
  var res = [], i = 0;
  function paso() {
    if (i >= combos.length) {
      var pre = document.createElement('pre');
      pre.id = 'salidaG';
      pre.textContent = JSON.stringify(res, null, 1);
      document.body.appendChild(pre);
      document.title = 'LISTO-G';
      return;
    }
    var c = combos[i++];
    pintarG(c[0], c[1], c[2]);
    res.push(medirG(c[0], c[1], c[2]));
    paso();
  }
  paso();
})();
</script></body></html>
